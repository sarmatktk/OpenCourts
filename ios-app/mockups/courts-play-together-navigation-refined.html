<div id="oc-navigation-refined" class="viz-dotted-background" aria-label="Refined OpenCourts navigation mockup">
  <style>
    #oc-navigation-refined {
      color-scheme: light dark;
      --ink: light-dark(#17231d, #eef4ef);
      --muted: light-dark(#7d8981, #a5b1a9);
      --canvas: light-dark(#f1f2f7, #171c19);
      --surface: light-dark(#ffffff, #242b27);
      --soft: light-dark(#eaf1eb, #2c3930);
      --line: light-dark(#dfe5e0, #3a473f);
      --green: light-dark(#356d4b, #9bd2a8);
      --map: light-dark(#e7eedf, #344337);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      display: grid;
      justify-items: center;
      padding: 8px 0 18px;
    }
    #oc-navigation-refined * { box-sizing: border-box; }
    #oc-navigation-refined button { font: inherit; color: inherit; }
    #oc-navigation-refined .device {
      width: min(100%, 375px);
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 40px;
      background: var(--canvas);
      box-shadow: 0 18px 50px #14231b25;
    }
    #oc-navigation-refined .screen {
      position: relative;
      height: 690px;
      overflow: hidden;
      border-radius: 30px;
      background: var(--canvas);
      display: grid;
      grid-template-rows: 28px 45px 1fr 76px;
    }
    #oc-navigation-refined .status { display:flex; justify-content:space-between; align-items:center; padding:0 17px; font-size:12px; font-weight:600; }
    #oc-navigation-refined .header { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 12px; }
    #oc-navigation-refined .header h2 { margin:0; font-size:18px; font-weight:600; letter-spacing:-.25px; }
    #oc-navigation-refined .header-actions { justify-self:end; display:flex; align-items:center; gap:10px; }
    #oc-navigation-refined .icon-button, #oc-navigation-refined .avatar {
      border:0; width:36px; height:36px; border-radius:50%; display:grid; place-items:center;
      background:var(--surface); color:var(--green);
    }
    #oc-navigation-refined .avatar { background:var(--soft); font-size:12px; font-weight:600; }
    #oc-navigation-refined .body { min-height:0; padding:5px 12px 6px; display:flex; flex-direction:column; gap:12px; }
    #oc-navigation-refined .sections { display:flex; align-items:center; justify-content:space-between; gap:2px; min-height:42px; padding:3px; border-radius:14px; background:var(--surface); }
    #oc-navigation-refined .sections button { flex:1 1 auto; white-space:nowrap; border:0; border-radius:11px; min-height:34px; padding:0 4px; background:transparent; color:var(--muted); font-size:11px; font-weight:500; }
    #oc-navigation-refined .sections button.active { color:var(--green); background:var(--soft); font-weight:600; }
    #oc-navigation-refined .location-card { display:flex; align-items:center; gap:11px; padding:11px 13px; background:var(--surface); border-radius:16px; }
    #oc-navigation-refined .location-icon { width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:var(--green);background:var(--soft); }
    #oc-navigation-refined .location-card strong { display:block;font-size:14px;font-weight:600; }
    #oc-navigation-refined .location-card small { display:block;color:var(--muted);font-size:11px;margin-top:2px; }
    #oc-navigation-refined .map { flex:1;min-height:280px;position:relative;overflow:hidden;border-radius:22px;background:var(--map);background-image:linear-gradient(28deg,transparent 48%,#fff9 49%,#fff9 50%,transparent 51%),linear-gradient(112deg,transparent 48%,#fff9 49%,#fff9 51%,transparent 52%),linear-gradient(75deg,transparent 60%,#cce2b9 61%,#cce2b9 74%,transparent 75%);background-size:150px 130px,190px 160px,100% 100%; }
    #oc-navigation-refined .map:before,#oc-navigation-refined .map:after { content:"";position:absolute;width:130%;height:11px;background:#c4cec4;border:2px solid #fafbf8;transform:rotate(-15deg);left:-15%;top:51%; }
    #oc-navigation-refined .map:after { transform:rotate(42deg);top:32%;opacity:.8; }
    #oc-navigation-refined .legend { position:absolute;z-index:1;top:10px;left:10px;right:10px;padding:9px 10px;border-radius:14px;background:color-mix(in srgb,var(--surface) 92%,transparent);display:flex;justify-content:space-around;font-size:10px;font-weight:500; }
    #oc-navigation-refined .map-name { position:absolute;z-index:1;top:43%;left:13%;font-size:10px;color:#596b5d;font-weight:500; }
    #oc-navigation-refined .pin { position:absolute;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--green);box-shadow:0 3px 9px #13241b38;font-size:14px; }
    #oc-navigation-refined .pin.current { background:#356d4b;color:white; }
    #oc-navigation-refined .map-tools { display:flex;gap:9px;position:absolute;z-index:2;right:11px;bottom:11px; }
    #oc-navigation-refined .map-tools button { width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--green);display:grid;place-items:center; }
    #oc-navigation-refined .feed-scroll { display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0;padding-bottom:4px; }
    #oc-navigation-refined .group-card,#oc-navigation-refined .game-card,#oc-navigation-refined .disclaimer { background:var(--surface);border-radius:17px;padding:14px; }
    #oc-navigation-refined .card-heading { display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin-bottom:11px; }
    #oc-navigation-refined .link { color:var(--green);font-weight:500;font-size:12px; }
    #oc-navigation-refined .group-chip { display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:13px;background:var(--soft);font-size:13px;font-weight:500; }
    #oc-navigation-refined .group-chip i { color:var(--green); }
    #oc-navigation-refined .eyebrow { color:var(--muted);font-size:10px;margin-bottom:5px; }
    #oc-navigation-refined .game-title { margin:0 0 6px;font-size:16px;font-weight:600; }
    #oc-navigation-refined .game-detail { color:var(--muted);font-size:12px;line-height:1.5; }
    #oc-navigation-refined .disclaimer { font-size:11px;color:var(--muted); }
    #oc-navigation-refined .alt-panel { background:var(--surface);border-radius:18px;padding:17px; }
    #oc-navigation-refined .alt-panel h3 { margin:0 0 7px;font-size:16px;font-weight:600; }
    #oc-navigation-refined .alt-panel p { margin:0;color:var(--muted);font-size:12px;line-height:1.5; }
    #oc-navigation-refined .bottom { margin:0 3px 4px;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--surface) 90%,transparent);box-shadow:0 5px 18px #15231c12; }
    #oc-navigation-refined .bottom button { border:0;background:transparent;color:var(--muted);border-radius:18px;min-height:58px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;font-size:11px;font-weight:500; }
    #oc-navigation-refined .bottom button.active { color:var(--green);background:var(--soft); }
    #oc-navigation-refined .bottom i { width:19px;height:19px; }
    @media(max-width:390px) { #oc-navigation-refined .screen{height:660px;} #oc-navigation-refined .section-caption{display:none;} }
  </style>
  <div class="device">
    <div class="screen">
      <div class="status"><span>9:41</span><span>•••　◉　▰</span></div>
      <header class="header"><span></span><h2 id="oc-nav-title">Courts</h2><div class="header-actions" id="oc-nav-actions"></div></header>
      <main class="body" id="oc-main-panel" role="tabpanel" aria-labelledby="oc-courts-tab">
        <nav class="sections" id="oc-sections" role="tablist" aria-label="Courts sections"></nav>
        <div id="oc-nav-content" style="display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;"></div>
      </main>
      <nav class="bottom" role="tablist" aria-label="Main destinations">
        <button id="oc-courts-tab" class="cursor-interaction active" role="tab" aria-controls="oc-main-panel" aria-selected="true" type="button"><i data-lucide="map" aria-hidden="true"></i><span>Courts</span></button>
        <button id="oc-play-tab" class="cursor-interaction" role="tab" aria-controls="oc-main-panel" aria-selected="false" type="button"><i data-lucide="users-round" aria-hidden="true"></i><span>Play Together</span></button>
      </nav>
    </div>
  </div>
  <script>
    (() => {
      const root = document.getElementById("oc-navigation-refined");
      const title = root.querySelector("#oc-nav-title");
      const actions = root.querySelector("#oc-nav-actions");
      const sectionNav = root.querySelector("#oc-sections");
      const content = root.querySelector("#oc-nav-content");
      const mainPanel = root.querySelector("#oc-main-panel");
      const courtsTab = root.querySelector("#oc-courts-tab");
      const playTab = root.querySelector("#oc-play-tab");
      const sections = {
        courts: [
          ["Map", "map", "See nearby courts on the map."],
          ["Courts", "list", "Browse court details, surfaces and lighting."],
          ["Search", "search", "Find courts by name, city or ZIP code."],
          ["Dry Courts", "sun", "Check which courts are likely to be dry."],
          ["Weather", "cloud-sun", "View local weather for playing." ]
        ],
        play: [
          ["Feed", "house", "See activity, groups and upcoming games."],
          ["Find Games", "search", "Find open games and nearby players."],
          ["My Games", "calendar-days", "Manage games you joined or organize."],
          ["Groups", "users-round", "Find and manage tennis groups."],
          ["Players", "user-round", "Discover players in your area."]
        ]
      };
      let destination = "courts";
      let selected = { courts: "Map", play: "Feed" };
      const icon = (name) => '<i data-lucide="' + name + '" aria-hidden="true"></i>';
      function refreshIcons() { if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 18, height: 18 } }); }
      function renderContent() {
        if (destination === "courts" && selected.courts === "Map") {
          content.innerHTML = '<div class="location-card"><div class="location-icon">' + icon("map-pin") + '</div><div><strong>Fairfax, Virginia</strong><small>476 courts nearby</small></div><button class="icon-button cursor-interaction" aria-label="Filters">' + icon("sliders-horizontal") + '</button></div><div class="map" role="img" aria-label="Map preview showing nearby tennis courts"><div class="legend">● Lighted　 ◌ Unlighted　 ● Unknown</div><span class="map-name">George Mason University</span><span class="pin" style="top:25%;left:22%">◉</span><span class="pin" style="top:40%;left:67%">◉</span><span class="pin current" style="top:58%;left:44%">◉</span><span class="pin" style="top:71%;left:25%">◉</span><span class="pin" style="top:76%;left:79%">◉</span><div class="map-tools"><button class="cursor-interaction" aria-label="Refresh courts">' + icon("rotate-cw") + '</button></div></div>';
        } else if (destination === "play" && selected.play === "Feed") {
          content.innerHTML = '<div class="feed-scroll"><section class="group-card"><div class="card-heading"><span>Your groups</span><span class="link">See all　›</span></div><div class="group-chip">' + icon("users-round") + ' Reston Tennis</div></section><section class="game-card"><div class="eyebrow">UPCOMING GAME · ORGANIZING</div><h3 class="game-title">Saturday game</h3><div class="game-detail">Tue, Nov 24 · 2:15 PM<br>Fair Woods Park · 1 / 2 places</div></section><div class="disclaimer">Games do not reserve courts.</div></div>';
        } else {
          const item = sections[destination].find((entry) => entry[0] === selected[destination]);
          content.innerHTML = '<section class="alt-panel"><h3>' + item[0] + '</h3><p>' + item[2] + '</p></section>';
        }
        refreshIcons();
      }
      function render() {
        const isCourts = destination === "courts";
        const current = selected[destination];
        title.textContent = isCourts ? "Courts" : "Play Together";
        sectionNav.setAttribute("aria-label", isCourts ? "Courts sections" : "Play Together sections");
        sectionNav.innerHTML = sections[destination].map((item) => '<button class="cursor-interaction ' + (item[0] === current ? "active" : "") + '" role="tab" aria-selected="' + (item[0] === current) + '" type="button" data-section="' + item[0] + '">' + item[0] + '</button>').join("");
        actions.innerHTML = isCourts ? '<button class="avatar cursor-interaction" aria-label="Open account">S</button>' : '<button class="icon-button cursor-interaction" aria-label="Notifications">' + icon("bell") + '</button><button class="avatar cursor-interaction" aria-label="Open account">S</button>';
        courtsTab.classList.toggle("active", isCourts);
        playTab.classList.toggle("active", !isCourts);
        courtsTab.setAttribute("aria-selected", String(isCourts));
        playTab.setAttribute("aria-selected", String(!isCourts));
        mainPanel.setAttribute("aria-labelledby", isCourts ? "oc-courts-tab" : "oc-play-tab");
        renderContent();
      }
      sectionNav.addEventListener("click", (event) => {
        const choice = event.target.closest("[data-section]");
        if (!choice) return;
        selected[destination] = choice.dataset.section;
        render();
      });
      courtsTab.addEventListener("click", () => { destination = "courts"; render(); });
      playTab.addEventListener("click", () => { destination = "play"; render(); });
      render();
    })();
  </script>
</div>

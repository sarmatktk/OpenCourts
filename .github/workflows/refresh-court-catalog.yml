name: Refresh court catalog

on:
  workflow_dispatch:
  schedule:
    # Refresh the nationwide catalog once a month. Run manually after adding
    # secrets to perform the initial import instead of waiting for this schedule.
    - cron: '17 9 1 * *'

permissions:
  contents: read

concurrency:
  group: court-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool

      - name: Check required Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)

      - name: Download and prepare all U.S. regions
        shell: bash
        run: |
          set -euo pipefail
          regions=(us-northeast us-midwest us-south us-west us-pacific)
          for region in "${regions[@]}"; do
            echo "Preparing ${region}"
            curl --fail --location --retry 3 --retry-delay 5 \
              "https://download.geofabrik.de/north-america/${region}-latest.osm.pbf" \
              --output "${region}.osm.pbf"
            osmium tags-filter "${region}.osm.pbf" \
              'nwr/sport=*tennis*' \
              --output "${region}-sites.osm.pbf"
            osmium export "${region}-sites.osm.pbf" \
              --output-format geojsonseq --attributes=type,id \
              --output "courts-${region}.geojsonseq"
            rm "${region}.osm.pbf" "${region}-sites.osm.pbf"
          done

      - name: Ensure D1 schema exists
        run: npx wrangler d1 execute opencourts-courts --remote --file=functions/db/migrations/0001_create_tennis_courts.sql

      - name: Import and publish court records
        shell: bash
        run: |
          regions=(us-northeast us-midwest us-south us-west us-pacific)
          inputs=()
          for region in "${regions[@]}"; do
            inputs+=(--input "courts-${region}.geojsonseq")
          done
          npm run import:courts -- "${inputs[@]}" --execute --database opencourts-courts

      - name: Verify imported records
        run: npx wrangler d1 execute opencourts-courts --remote --command="SELECT COUNT(*) AS court_count FROM tennis_courts"

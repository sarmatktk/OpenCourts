<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">OpenCourts — Find your court</title>
  <desc id="description">Explore public tennis courts, check recent rain, and plan your next match with OpenCourts.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#091b16" stop-opacity=".96"/>
      <stop offset=".36" stop-color="#0b2019" stop-opacity=".88"/>
      <stop offset=".57" stop-color="#10251b" stop-opacity=".52"/>
      <stop offset=".76" stop-color="#10251b" stop-opacity=".08"/>
      <stop offset="1" stop-color="#10251b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lower-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081a14" stop-opacity="0"/>
      <stop offset="1" stop-color="#081a14" stop-opacity=".42"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#06130e" flood-opacity=".28"/>
    </filter>
  </defs>
  <image href="social-preview-photo.png" width="1200" height="630" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="630" fill="url(#shade)"/>
  <rect width="1200" height="630" fill="url(#lower-shade)"/>

  <g transform="translate(77 66)" filter="url(#soft-shadow)">
    <circle cx="24" cy="24" r="23" fill="#112c22" fill-opacity=".86" stroke="#d8e5c0" stroke-opacity=".58" stroke-width="1.4"/>
    <circle cx="24" cy="24" r="12.2" fill="none" stroke="#e0edc8" stroke-width="1.7"/>
    <path d="M16.7 14.7c4 3.1 6 6.2 6 9.3s-2 6.2-6 9.3M31.3 14.7c-4 3.1-6 6.2-6 9.3s2 6.2 6 9.3" fill="none" stroke="#e0edc8" stroke-width="1.5"/>
    <text x="62" y="33" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="-1.4" fill="#f5f5ed">open<tspan font-weight="400" fill="#c4d1c2">courts</tspan></text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" filter="url(#soft-shadow)">
    <rect x="79" y="157" width="10" height="10" rx="5" fill="#d8ee72"/>
    <text x="101" y="167" font-size="14" font-weight="700" letter-spacing="2.8" fill="#e4efc9">YOUR NEXT MATCH STARTS HERE</text>
    <text x="72" y="271" font-family="Georgia, 'Times New Roman', serif" font-size="72" letter-spacing="-2.8" fill="#fffdf3">Find your court.</text>
    <text x="80" y="325" font-size="21" fill="#e1e8dc">Explore public courts, check recent rain,</text>
    <text x="80" y="356" font-size="21" fill="#e1e8dc">and plan a better time to play.</text>
  </g>

  <g transform="translate(79 415)" font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect width="158" height="43" rx="21.5" fill="#0d2d22" fill-opacity=".82" stroke="#dae7c9" stroke-opacity=".42"/>
      <circle cx="22" cy="21.5" r="5.5" fill="#d8ee72"/>
      <text x="37" y="26" font-size="14" font-weight="600" fill="#f3f4eb">Public courts</text>
    </g>
    <g transform="translate(170)">
      <rect width="143" height="43" rx="21.5" fill="#0d2d22" fill-opacity=".82" stroke="#dae7c9" stroke-opacity=".42"/>
      <circle cx="22" cy="21.5" r="5.5" fill="#e2b86f"/>
      <text x="37" y="26" font-size="14" font-weight="600" fill="#f3f4eb">Recent rain</text>
    </g>
    <g transform="translate(325)">
      <rect width="157" height="43" rx="21.5" fill="#0d2d22" fill-opacity=".82" stroke="#dae7c9" stroke-opacity=".42"/>
      <circle cx="22" cy="21.5" r="5.5" fill="#b4d976"/>
      <text x="37" y="26" font-size="14" font-weight="600" fill="#f3f4eb">Local forecast</text>
    </g>
  </g>

  <path d="M80 523H585" stroke="#e4efd5" stroke-opacity=".28"/>
  <text x="80" y="562" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.1" fill="#edf1e2">OPENCOURTS.US</text>
  <path d="M286 556H318" stroke="#d8ee72" stroke-width="2" stroke-linecap="round"/>
  <path d="M312 550 318 556 312 562" fill="none" stroke="#d8ee72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

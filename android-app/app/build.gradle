plugins {
    id 'com.android.application'
}

android {
    namespace 'us.opencourts.app'
    compileSdk 36
    buildFeatures { resValues = true }

    defaultConfig {
        applicationId 'us.opencourts.app'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.1.0'
        manifestPlaceholders = [webHost: 'opencourts.us']
        resValue 'string', 'twa_start_url', 'https://opencourts.us/'
        resValue 'string', 'twa_asset_statements', '[{\"relation\":[\"delegate_permission/common.handle_all_urls\"],\"target\":{\"namespace\":\"web\",\"site\":\"https://opencourts.us\"}}]'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            manifestPlaceholders = [webHost: 'feature-play-together.opencourts.pages.dev']
            resValue 'string', 'twa_start_url', 'https://feature-play-together.opencourts.pages.dev/'
            resValue 'string', 'twa_asset_statements', '[{\"relation\":[\"delegate_permission/common.handle_all_urls\"],\"target\":{\"namespace\":\"web\",\"site\":\"https://feature-play-together.opencourts.pages.dev\"}}]'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
